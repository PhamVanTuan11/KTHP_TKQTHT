services:
  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    container_name: ro-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/lib/containerd:/var/lib/containerd:ro
    networks:
      - ro_monitoring_network

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.1
    container_name: ro-nginx-exporter
    restart: unless-stopped
    command:
      - "--nginx.scrape-uri=http://nginx:8082/stub_status"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - ro_monitoring_network
    depends_on:
      nginx:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: ro-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: "postgres:5432/${POSTGRES_DB:-ro_db}?sslmode=disable"
      DATA_SOURCE_USER: ${EXPORTER_DB_USER:-postgres_exporter}
      DATA_SOURCE_PASS: ${EXPORTER_DB_PASSWORD}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - ro_database_network
      - ro_monitoring_network
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: ro-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - ro_prometheus_data:/prometheus
    security_opt:
      - no-new-privileges:true
    networks:
      - ro_monitoring_network
    depends_on:
      - cadvisor
      - nginx-exporter
      - postgres-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: ro-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    volumes:
      - ro_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - ro_monitoring_network
    depends_on:
      - prometheus

volumes:
  ro_prometheus_data:
    name: ro_prometheus_data
  ro_grafana_data:
    name: ro_grafana_data
