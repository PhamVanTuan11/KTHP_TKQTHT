server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service: reverse-proxy
          __path__: /logs/nginx/*.log

  - job_name: app
    static_configs:
      - targets:
          - localhost
        labels:
          job: app
          service: restaurant-order-app
          __path__: /logs/app/*.log
